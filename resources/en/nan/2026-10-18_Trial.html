<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trial</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --line: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Noto Sans Thai", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 30px;
        }

        h2 {
            border-bottom: 2px solid var(--line);
            padding-bottom: 10px;
            margin-top: 0;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h3 {
            margin: 0 0 12px;
            color: #334155;
            font-size: 1.1rem;
        }

        .section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Pictures */
        .pic {
            margin: 0 0 28px;
            text-align: center;
        }

        .pic:last-child {
            margin-bottom: 0;
        }

        .pic img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 0 auto;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #f1f5f9;
        }

        .pic-error {
            border: 1px dashed #cbd5e1;
            border-radius: 10px;
            padding: 24px 16px;
            text-align: center;
            color: var(--text-muted);
            background: #f8fafc;
        }

        .drive-link {
            display: inline-block;
            margin-top: 6px;
            font-size: 0.9rem;
            color: var(--primary);
        }

        /* HW */
        .hw-item {
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 1px dashed #cbd5e1;
        }

        .hw-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .hw-item .pic {
            margin-bottom: 18px;
        }

        .audio-block {
            margin-top: 14px;
        }

        .audio-label {
            font-weight: 600;
            margin-bottom: 6px;
        }

        .audio-block audio {
            display: block;
            width: 100%;
        }

        /* Vocabulary */
        .learning-block {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px dashed #cbd5e1;
        }

        .learning-block:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .main-line {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .action-buttons {
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-tts {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .btn-tts:hover {
            background-color: #bfdbfe;
        }

        .btn-toggle {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid var(--line);
        }

        .btn-toggle:hover {
            background-color: #e2e8f0;
        }

        .hidden-content {
            display: none;
            background-color: #f8fafc;
            border-left: 4px solid var(--primary);
            padding: 12px;
            margin-top: 10px;
            border-radius: 0 8px 8px 0;
            font-size: 1.05rem;
        }

        .pron {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-left: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Trial</h1>

    <!-- Pictures -->

        <figure class="pic">

            <a class="drive-link" href="https://drive.google.com/open?id=1My6r0eTPK3cZyvfEdbY-RIQWl_5gAuYK&amp;usp=drive_fs" target="_blank" rel="noopener noreferrer">Open in Google Drive</a>
        </figure>
        <figure class="pic">
            <img src="https://drive.google.com/thumbnail?id=1-BannhhSItT6OranqFVZuxZpt4cUo3DT&amp;sz=w1600" width="664" height="228" alt="Picture 2" loading="lazy" onerror="picFailed(this)">
            <a class="drive-link" href="https://drive.google.com/open?id=1-BannhhSItT6OranqFVZuxZpt4cUo3DT&amp;usp=drive_fs" target="_blank" rel="noopener noreferrer">Open in Google Drive</a>
        </figure>

        </figure>
        <figure class="pic">

            <a class="drive-link" href="https://drive.google.com/open?id=1WU01qoG-zXrjw4RhNt7vmcEHGd0dKu7H&amp;usp=drive_fs" target="_blank" rel="noopener noreferrer">Open in Google Drive</a>
        </figure>
        <figure class="pic">
            <img src="https://drive.google.com/thumbnail?id=1obeyq6NO7kALwcG3OtszSbyxtmbr8S7a&amp;sz=w1600" width="534" height="616" alt="Picture 5" loading="lazy" onerror="picFailed(this)">

    <!-- Additional Vocabulary -->

        <div class="learning-block">
            <div class="main-line">

            <div class="main-line">

            </div>
            <div class="action-buttons">
                <button class="btn-toggle" onclick="toggleView('en-vocab2')">🇬🇧 EN</button>

        <div class="learning-block">

                <span>สำเนียง</span>
                <button class="btn-tts" onclick="speakText('dialect')">🔊 Listen</button>

            </div>

        </div>
    </div>

</div>

<script>
    // Drive pictures only load when the file is shared as "Anyone with the link"
    function picFailed(img) {
        const note = document.createElement('div');
        note.className = 'pic-error';
        note.textContent = "This picture couldn't load here. Tap \"Open in Google Drive\" below. / โหลดรูปไม่ได้ กด \"Open in Google Drive\" ด้านล่างค่ะ";
        img.replaceWith(note);
    }

    // Toggle Content Visibility
    function toggleView(elementId) {
        const element = document.getElementById(elementId);
        if (element.style.display === "block") {
            element.style.display = "none";
        } else {
            element.style.display = "block";
        }
    }

    // Text-to-Speech Integration
    function speakText(text) {
        if ('speechSynthesis' in window) {
            // Cancel any ongoing speech
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);

            // Slightly slower for clear listening
            utterance.rate = 0.85;
            utterance.pitch = 1;

            // Attempt to use a British English voice
            const voices = window.speechSynthesis.getVoices();
            const ukVoice = voices.find(voice => voice.lang === 'en-GB');
            if (ukVoice) {
                utterance.voice = ukVoice;
            } else {
                utterance.lang = 'en-GB';
            }

            window.speechSynthesis.speak(utterance);
        } else {
            alert("Sorry, your browser does not support Text-to-Speech.");
        }
    }

    // Pre-load voices for Safari/iOS compatibility
    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = function() {
            window.speechSynthesis.getVoices();
        };
    }
</script>

</body>
</html>
